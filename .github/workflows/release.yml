name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-skills.mjs
      - name: Package skills
        run: |
          mkdir -p dist
          zip -qr dist/pixelcraft-skills.zip skills
          tar -czf dist/pixelcraft-skills.tar.gz skills
          ls -lh dist
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/pixelcraft-skills.zip dist/pixelcraft-skills.tar.gz --generate-notes
